name: Bug report
description: Something in the VLC Redesign build does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This is an unofficial build. Please do not report these problems to VideoLAN.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A short description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: version
    attributes:
      label: Release tag or commit
      placeholder: redesign-v0.2.0
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - Portable zip / 7z
        - Installer (.exe)
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: Windows 11 23H2, 64-bit
    validations:
      required: true
  - type: input
    id: scaling
    attributes:
      label: Screen scaling, if not 100 %
  - type: textarea
    id: extra
    attributes:
      label: Extra information
      description: >
        Screenshots, the media type (video, audio, stream), and, for crashes or freezes,
        a memory dump (Task Manager › Details › right-click vlc.exe › Create memory dump
        file, while it is frozen) or the log from the Messages window (Ctrl+M).
